<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPT Telecom Huế - Master Control (TAIHD)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .menu-card { transition: all 0.2s ease-in-out; cursor: pointer; }
        .menu-card:hover { transform: translateY(-3px); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased min-h-screen flex items-center justify-center p-6">

    <div class="max-w-xl w-full bg-slate-900 border border-slate-800 p-8 rounded-3xl shadow-2xl space-y-6 text-center">
        <!-- Header Title -->
        <div class="space-y-2">
            <div class="inline-flex items-center justify-center bg-orange-600/10 text-orange-500 p-3 rounded-2xl mb-1 border border-orange-500/20">
                <i class="fa-solid fa-network-wired text-2xl"></i>
            </div>
            <h1 class="text-xl font-extrabold text-white uppercase tracking-wider">Hệ Thống Điều Hành FPT Telecom Huế</h1>
            <p class="text-xs text-slate-400 font-semibold uppercase tracking-wide">Quản lý điều hành: TAIHD • Vùng 13</p>
        </div>
        
        <!-- Navigation Buttons -->
        <div class="grid grid-cols-1 gap-4 pt-2">
            <!-- Mục 1 -->
            <button onclick="openDashboard('Tổng hợp TaiHD1.html')" class="menu-card flex items-center justify-between p-4 bg-orange-600 hover:bg-orange-500 text-white rounded-2xl font-bold text-xs shadow-lg transition cursor-pointer border border-orange-500">
                <span class="flex items-center gap-3.5 text-sm">
                    <i class="fa-solid fa-gauge text-base bg-orange-700/50 p-2.5 rounded-xl"></i> 
                    <span>1. Tổng Hợp Vận Hành & Ca Hủy</span>
                </span>
                <i class="fa-solid fa-arrow-right text-sm opacity-80 pr-1"></i>
            </button>
            
            <!-- Mục 2 -->
            <button onclick="openDashboard('KPI.html')" class="menu-card flex items-center justify-between p-4 bg-blue-600 hover:bg-blue-500 text-white rounded-2xl font-bold text-xs shadow-lg transition cursor-pointer border border-blue-500">
                <span class="flex items-center gap-3.5 text-sm">
                    <i class="fa-solid fa-chart-line text-base bg-blue-700/50 p-2.5 rounded-xl"></i> 
                    <span>2. Quản Trị Hiệu Suất KPI Kỹ Thuật</span>
                </span>
                <i class="fa-solid fa-arrow-right text-sm opacity-80 pr-1"></i>
            </button>
            
            <!-- Mục 3 -->
            <button onclick="openDashboard('Thu Hồi.html')" class="menu-card flex items-center justify-between p-4 bg-rose-600 hover:bg-rose-500 text-white rounded-2xl font-bold text-xs shadow-lg transition cursor-pointer border border-rose-500">
                <span class="flex items-center gap-3.5 text-sm">
                    <i class="fa-solid fa-triangle-exclamation text-base bg-rose-700/50 p-2.5 rounded-xl"></i> 
                    <span>3. Giám Sát Thiết Bị Chưa Thu Hồi</span>
                </span>
                <i class="fa-solid fa-arrow-right text-sm opacity-80 pr-1"></i>
            </button>
        </div>

        <!-- Footer Note -->
        <div class="pt-2 border-t border-slate-800 text-[11px] text-slate-500">
            FPT Telecom Chi Nhánh Huế &copy; 2026 • Master Control Center
        </div>
    </div>

    <!-- Script điều hướng -->
    <script>
        function openDashboard(filename) {
            window.open(filename, '_blank');
        }
    </script>
</body>
</html>
